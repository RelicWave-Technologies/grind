name: Package Windows Agent

# Not a duplicate of release-agent.yml's Windows job: this builds a one-off
# unsigned installer as a workflow artifact only — no version check, no GitHub
# Release, no macOS signing secrets, no updater metadata published
# (DEPLOY.md, "one-off unsigned Windows installer").
#
# The installed app still follows the PUBLISHED release feed, so a machine set
# up from one of these artifacts joins the normal update stream instead of
# being stranded on it. Its update channel comes from the package version
# (package-windows.mjs: -beta.N → beta); it used to be baked as "latest" with
# updates off, a combination that can never update.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Production API URL baked into the agent
        required: true
        default: https://timo.emiactech.com
      auto_update:
        description: Let the installed app update itself from published releases
        required: true
        type: boolean
        default: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18
          cache: pnpm

      # Same pin as release-agent.yml: Python 3.12+ removed distutils, which
      # node-gyp needs to rebuild native deps (get-windows / better-sqlite3).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile

      - name: Write production agent env
        shell: pwsh
        run: |
          $lines = @(
            "MAIN_VITE_API_URL=${{ inputs.api_url }}",
            "MAIN_VITE_CALLBACK_SCHEME=timo"
          )
          if ("${{ inputs.auto_update }}" -eq "true") { $lines += "MAIN_VITE_AUTO_UPDATE_ENABLED=1" }
          $lines | Out-File -FilePath apps/agent/.env.production -Encoding utf8

      - name: Build unsigned Windows x64 installer
        run: pnpm --filter @grind/agent package:win:x64

      - uses: actions/upload-artifact@v4
        with:
          name: timo-windows-x64
          path: |
            apps/agent/release/*.exe
            apps/agent/release/*.blockmap
            apps/agent/release/*.yml
          if-no-files-found: error
