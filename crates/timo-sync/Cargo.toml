[package]
name = "timo-sync"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["tls"]
# rustls + the platform certificate verifier. Off only for the Windows
# cross-check on a Mac, which has no SDK to build the C crypto against.
tls = ["reqwest/rustls"]

[dependencies]
timo-core = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
gethostname = { workspace = true }
keyring = { workspace = true }
sha1 = { workspace = true }
pbkdf2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
aes-gcm = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
# The mock HTTP server in tests/ is a few lines of tokio sockets: no real network.
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
