# Timo desktop: Tauri app + Rust crates. The React renderer stays in TypeScript;
# everything else the desktop app does lives here. legacy/agent (Electron) is
# the parity oracle until cutover. Rules: AGENTS.md "Desktop: Tauri + Rust".
[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

# Exact pins (=x.y.z). Add a dependency here, never in a member with a version.
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: parse f64 correctly rounded, as V8 does. Without it serde_json
# can be one ULP off on long fractional timestamps, which would change the pay.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
# Collation: reproduces JavaScript's `String.prototype.localeCompare` for the sort tiebreaks in
# timo-core, under the process's ICU default locale. 1.5.0 is the CLDR 44 generation of Electron 33's
# ICU 74.2 (the oracle); the 2.x data collates as ICU 78 does. See crates/timo-core/PARITY.md, "Locale".
icu_collator = "=1.5.0"
# Parses the locale tag the collator is built for (the ICU default locale, see js::collate).
icu_locid = "=1.5.0"
# ECMAScript Number::toString (shortest round-trip digits, JS exponent rules).
ryu-js = "=1.0.3"
# Business-day maths (timo-core::tz). Electron 33.2.0's ICU carries tzdata 2024a
# (see crates/timo-core/PARITY.md), so the data crate is pinned to the release
# that embeds 2024a, not the newest. jiff itself only reads TZif (no bundled db,
# no system db): the data is exactly jiff-tzdb's, on every OS.
jiff-tzdb = "=0.1.0"

# Desktop shell (apps/desktop/src-tauri). Tauri 3 is alpha, so the shell stays on
# 2.x; the JS side (@tauri-apps/api, @tauri-apps/cli) is pinned to the same 2.12.1.
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = "=2.7.1"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-process = "=2.4.0"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-updater = "=2.13.1"
# macOS NSPanel (floating bar + prompt overlays), same pin as Airnote.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
tracing-subscriber = "=0.3.23"
# timo-platform: macOS notifications (NSWorkspace / distributed centre) and the
# Windows hooks + message window. Same versions Tauri already locks.
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString", "NSObject"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
windows = "=0.62.2"

# timo-sync (HTTP, auth, tokens) and timo-store (SQLite). Exact pins, like the rest.
# reqwest 0.13.5 and tokio 1.53.2 are what Tauri already locks, so no second copy
# of either is built. TLS is rustls with the platform verifier (the `tls` feature
# of timo-sync turns on reqwest's `rustls`), never OpenSSL, so Windows needs no
# system library. It is a feature because a Mac cannot build aws-lc/ring or
# SQLite's C for x86_64-pc-windows-msvc (no Windows SDK headers):
# `cargo clippy -p timo-sync -p timo-store --no-default-features --target
# x86_64-pc-windows-msvc` checks all the Rust without them.
reqwest = { version = "=0.13.5", default-features = false, features = ["multipart", "system-proxy"] }
tokio = { version = "=1.53.2", features = ["rt", "sync", "time", "macros", "fs"] }
# `bundled` is timo-store's default feature: the SQLite we test is the SQLite we ship.
rusqlite = { version = "=0.40.2" }
# OS keychain (macOS Keychain, Windows Credential Manager) for the session.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.3.4"
gethostname = "=1.1.0"
# Chromium os_crypt (Electron safeStorage) decryption, for the one-time import
# of the Electron agent's tokens.bin / pending-lark-login.bin.
sha1 = "=0.10.6"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
aes = "=0.8.4"
cbc = "=0.1.2"
aes-gcm = "=0.10.3"

# timo-platform screenshot pipeline: libwebp (the encoder sharp wraps) and a SIMD
# resizer. `webp` without its default `image` feature: we only need the encoder.
webp = { version = "=0.3.1", default-features = false }
fast_image_resize = "=6.1.0"
# Dev-only: decode the parity fixtures' source frames.
png = "=0.18.1"

# timo-core timer engine (async driver, shared in-flight futures). The 0.3.34 Tauri
# already locks.
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "alloc"] }

timo-core = { path = "crates/timo-core" }
timo-store = { path = "crates/timo-store" }
timo-platform = { path = "crates/timo-platform" }
timo-sync = { path = "crates/timo-sync" }

[workspace.lints.rust]
# deny, not forbid: timo-platform needs FFI and opts in at its crate root with a
# reason. Every other crate re-forbids it in lib.rs.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# Parity: every numeric conversion is spelled out (JS numbers are f64; ours are
# i64 milliseconds), so a silent `as` truncation cannot change someone's pay.
as_conversions = "deny"
float_arithmetic = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
string_slice = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
too_many_lines = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Debug builds of the screenshot encoder are ~50x too slow to test at -O0 (libwebp's
# C is compiled with the package's opt-level too).
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
